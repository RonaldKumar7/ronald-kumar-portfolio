<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Clock - Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .timezone-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .location {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 20px;
        }

        .time-display {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.95em;
            color: #999;
            margin-top: 10px;
        }

        .period {
            font-size: 1.2em;
            color: #764ba2;
            font-weight: bold;
            margin-top: 10px;
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            border: 8px solid #667eea;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            background: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .clock-center {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #333;
            border-radius: 10px;
        }

        .hour-hand {
            width: 6px;
            height: 35px;
            margin-left: -3px;
            background: #333;
        }

        .minute-hand {
            width: 4px;
            height: 45px;
            margin-left: -2px;
            background: #667eea;
        }

        .second-hand {
            width: 2px;
            height: 50px;
            margin-left: -1px;
            background: #764ba2;
        }

        .clock-number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
        }

        .clock-number span {
            display: inline-block;
            position: absolute;
            width: 30px;
            height: 30px;
            line-height: 30px;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            transition: opacity 0.3s;
        }

        .back-link a:hover {
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 World Clock</h1>
        
        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button class="btn" onclick="toggleAnalogClock()">Toggle Analog Clocks</button>
            <button class="btn" onclick="location.href='index.html'">Back to Portfolio</button>
        </div>

        <div class="back-link">
            <a href="index.html">← Return to Portfolio</a>
        </div>
    </div>

    <script>
        const timeZones = [
            { name: 'New York', zone: 'America/New_York', location: 'Eastern Time (EST/EDT)' },
            { name: 'Los Angeles', zone: 'America/Los_Angeles', location: 'Pacific Time (PST/PDT)' },
            { name: 'London', zone: 'Europe/London', location: 'Greenwich Mean Time' },
            { name: 'Paris', zone: 'Europe/Paris', location: 'Central European Time' },
            { name: 'Dubai', zone: 'Asia/Dubai', location: 'Gulf Standard Time' },
            { name: 'India', zone: 'Asia/Kolkata', location: 'Indian Standard Time' },
            { name: 'Singapore', zone: 'Asia/Singapore', location: 'Singapore Standard Time' },
            { name: 'Tokyo', zone: 'Asia/Tokyo', location: 'Japan Standard Time' },
            { name: 'Sydney', zone: 'Australia/Sydney', location: 'Australian Eastern Time' },
            { name: 'Auckland', zone: 'Pacific/Auckland', location: 'New Zealand Time' },
            { name: 'Toronto', zone: 'America/Toronto', location: 'Eastern Time' },
            { name: 'Mexico City', zone: 'America/Mexico_City', location: 'Central Time' }
        ];

        let showAnalogClocks = true;

        function formatTime(date) {
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
        }

        function getTimeInZone(zone) {
            return new Date(new Date().toLocaleString('en-US', { timeZone: zone }));
        }

        function createClockCard(timezone) {
            const time = getTimeInZone(timezone.zone);
            const hours = String(time.getHours()).padStart(2, '0');
            const minutes = String(time.getMinutes()).padStart(2, '0');
            const seconds = String(time.getSeconds()).padStart(2, '0');
            const period = time.getHours() >= 12 ? 'PM' : 'AM';

            let clockHTML = `
                <div class="clock-card">
                    <div class="timezone-name">${timezone.name}</div>
                    <div class="location">${timezone.location}</div>
            `;

            if (showAnalogClocks) {
                clockHTML += createAnalogClock(time);
            }

            clockHTML += `
                    <div class="time-display">${hours}:${minutes}:${seconds}</div>
                    <div class="date-display">${formatDate(time)}</div>
                    <div class="period">${period}</div>
                </div>
            `;

            return clockHTML;
        }

        function createAnalogClock(date) {
            const hours = date.getHours();
            const minutes = date.getMinutes();
            const seconds = date.getSeconds();

            const hourDegrees = (hours % 12) * 30 + minutes * 0.5;
            const minuteDegrees = minutes * 6 + seconds * 0.1;
            const secondDegrees = seconds * 6;

            return `
                <div class="analog-clock">
                    <div class="hand hour-hand" style="transform: rotate(${hourDegrees}deg);"></div>
                    <div class="hand minute-hand" style="transform: rotate(${minuteDegrees}deg);"></div>
                    <div class="hand second-hand" style="transform: rotate(${secondDegrees}deg);"></div>
                    <div class="clock-center"></div>
                </div>
            `;
        }

        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = timeZones.map(tz => createClockCard(tz)).join('');
        }

        function toggleAnalogClock() {
            showAnalogClocks = !showAnalogClocks;
            updateClocks();
        }

        // Update clocks every second
        setInterval(updateClocks, 1000);

        // Initial update
        updateClocks();
    </script>
</body>
</html>
